<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>IA Studio</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        padding: 26px 28px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        /* Same stops as build/icon.svg: the splash and the Dock icon must read as one object. */
        background: linear-gradient(158deg, #3b4256 0%, #22242a 55%, #191a1c 100%);
        color: #dfe1e5;
        font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        user-select: none;
        cursor: default;
        -webkit-app-region: drag;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .mark {
        width: 54px;
        height: 54px;
        flex: none;
      }
      .name {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      .version {
        font-size: 11px;
        color: #91959b;
        margin-top: 3px;
        font-variant-numeric: tabular-nums;
      }
      .track {
        height: 2px;
        background: #34363a;
        border-radius: 2px;
        overflow: hidden;
      }
      /* Indeterminate: startup is one synchronous block, so any percentage would be invented. */
      .fill {
        height: 100%;
        width: 40%;
        background: #346ef2;
        border-radius: 2px;
        animation: sweep 1.25s ease-in-out infinite;
      }
      @keyframes sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fill {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div class="top">
      <!--
        The icon's robot, without its chassis: this surface already paints the same gradient the
        chassis carries, so drawing it again would put a tile on a tile. Scaled and centred out of
        the 1024 grid `build/icon.svg` is drawn on, which stays the one place the shape is authored.
      -->
      <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="splashShell" x1="0" y1="0" x2="0.3" y2="1">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="1" stop-color="#d3d9e4" />
          </linearGradient>
        </defs>
        <g transform="translate(-170 -110) scale(0.75)">
          <path d="M 512 272 L 512 234" stroke="#8fb4f7" stroke-width="15" stroke-linecap="round" />
          <circle cx="512" cy="214" r="27" fill="#6193f3" />
          <path
            d="M 654 616 L 728 560"
            stroke="url(#splashShell)"
            stroke-width="44"
            stroke-linecap="round"
          />
          <path
            d="M 370 616 L 298 668"
            stroke="url(#splashShell)"
            stroke-width="44"
            stroke-linecap="round"
          />
          <path d="M 736 552 L 812 476" stroke="#aab3c2" stroke-width="26" stroke-linecap="round" />
          <path d="M 818 470 L 844 444" stroke="#346ef2" stroke-width="35" stroke-linecap="round" />
          <rect x="316" y="378" width="30" height="76" rx="15" fill="#aab3c2" />
          <rect x="678" y="378" width="30" height="76" rx="15" fill="#aab3c2" />
          <rect x="478" y="516" width="68" height="46" fill="#c2c9d6" />
          <rect x="372" y="556" width="280" height="198" rx="58" fill="url(#splashShell)" />
          <rect x="344" y="286" width="336" height="250" rx="78" fill="url(#splashShell)" />
          <rect x="378" y="338" width="268" height="122" rx="61" fill="#14161c" />
          <circle cx="452" cy="399" r="31" fill="#6193f3" />
          <circle cx="572" cy="399" r="31" fill="#6193f3" />
          <circle cx="443" cy="389" r="10" fill="#ffffff" opacity="0.85" />
          <circle cx="563" cy="389" r="10" fill="#ffffff" opacity="0.85" />
          <rect x="470" y="488" width="84" height="13" rx="6" fill="#aab3c2" />
          <rect x="436" y="598" width="152" height="106" rx="34" fill="#346ef2" />
          <rect x="466" y="628" width="92" height="13" rx="6" fill="#ffffff" opacity="0.95" />
          <rect x="466" y="654" width="68" height="13" rx="6" fill="#ffffff" opacity="0.7" />
          <rect x="466" y="680" width="44" height="13" rx="6" fill="#ffffff" opacity="0.45" />
        </g>
      </svg>
      <div>
        <div class="name">IA Studio</div>
        <div class="version" id="version"></div>
      </div>
    </div>
    <div class="track"><div class="fill"></div></div>
    <script type="module" src="/src/splash.ts"></script>
  </body>
</html>
