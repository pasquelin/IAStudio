<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>IA Studio</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        padding: 26px 28px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        /* The tile colour of build/icon.svg: the splash and the Dock icon must read as one object. */
        background: #161921;
        color: #dfe1e5;
        font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        user-select: none;
        cursor: default;
        -webkit-app-region: drag;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .mark {
        width: 54px;
        height: 54px;
        flex: none;
      }
      .name {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      .version {
        font-size: 11px;
        color: #91959b;
        margin-top: 3px;
        font-variant-numeric: tabular-nums;
      }
      .track {
        height: 2px;
        background: #34363a;
        border-radius: 2px;
        overflow: hidden;
      }
      /* Indeterminate: startup is one synchronous block, so any percentage would be invented. */
      .fill {
        height: 100%;
        width: 40%;
        background: #346ef2;
        border-radius: 2px;
        animation: sweep 1.25s ease-in-out infinite;
      }
      @keyframes sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fill {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div class="top">
      <!--
        The icon's monogram, without its tile: this surface already paints the tile colour. COPIED
        rather than imported — a separate Vite entry under `default-src 'none'` reaches no file —
        and every shape below is pinned to `build/icon.svg` by `splash.test.ts`.
      -->
      <svg class="mark" viewBox="247 229 566 566" xmlns="http://www.w3.org/2000/svg">
        <circle cx="327" cy="351" r="53" fill="#346ef2" />
        <rect x="276" y="431" width="102" height="295" rx="44" fill="#346ef2" />
        <path
          d="M 414.0 726.0 Q 391.0 726.0 391.0 703.0 L 391.0 635.0 Q 391.0 621.0 397.3 608.5
             L 504.0 395.0 Q 566.0 271.0 628.0 395.0 L 783.2 705.4 Q 793.5 726.0 770.5 726.0
             L 714.5 726.0 Q 691.5 726.0 681.2 705.4 L 592.8 528.7 Q 566.0 475.0 539.2 528.7
             L 450.8 705.4 Q 440.5 726.0 417.5 726.0 Z"
          fill="#ffffff"
        />
        <path
          d="M 508.0 726.0 Q 488.0 726.0 496.9 708.1 L 541.4 619.2 Q 566.0 570.0 590.6 619.2
             L 635.1 708.1 Q 644.0 726.0 624.0 726.0 Z"
          fill="#346ef2"
        />
      </svg>
      <div>
        <div class="name">IA Studio</div>
        <div class="version" id="version"></div>
      </div>
    </div>
    <div class="track"><div class="fill"></div></div>
    <script type="module" src="/src/splash.ts"></script>
  </body>
</html>
