<!doctype html>
<meta charset="utf-8" />
<title>Spike WebGL vs WebGPU</title>
<style>
  body { background: #0d0f14; color: #cfd6e4; font: 13px ui-monospace, monospace; margin: 0; padding: 12px; }
  #stage canvas { display: block; border: 1px solid #2a3040; }
  #log { margin-top: 8px; white-space: pre-wrap; }
</style>
<body>
  <div id="stage"></div>
  <div id="log">démarrage…</div>
  <script type="module">
    import { runAll } from './bench.js'
    const log = document.querySelector('#log')
    window.__done = false
    window.__report = null
    const query = new URLSearchParams(location.search)
    const list = key => (query.get(key) ? query.get(key).split(',') : null)
    const filter = {
      cases: list('cases'),
      counts: list('counts')?.map(Number),
      backends: list('backends'),
    }
    runAll(
      step => {
        log.textContent = `${step.done}/${step.total} — ${step.backend} · ${step.caseId} · ${step.count}`
      },
      filter,
    )
      .then(report => {
        window.__report = report
        window.__done = true
        log.textContent = `terminé : ${report.results.length} mesures, ${report.failures.length} échecs`
      })
      .catch(error => {
        window.__report = { results: [], failures: [{ fatal: String(error?.stack ?? error) }] }
        window.__done = true
        log.textContent = `échec : ${error}`
      })
  </script>
</body>
