<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Apple's macOS grid, not a full-bleed square: the system masks nothing, so an icon drawn
       edge to edge sits in the Dock as a hard rectangle among rounded neighbours. -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="#161921"/>

  <circle cx="327" cy="351" r="53" fill="#346ef2"/>
  <rect x="276" y="431" width="102" height="295" rx="44" fill="#346ef2"/>

  <!-- 18px right of a centred box on purpose: the stem is solid ink and the A is hollow, so the
       mark's mass falls 37px left of the tile's centre and a box-centred mark reads as leaning. -->
  <path
    d="M 414.0 726.0 Q 391.0 726.0 391.0 703.0 L 391.0 635.0 Q 391.0 621.0 397.3 608.5
       L 504.0 395.0 Q 566.0 271.0 628.0 395.0 L 783.2 705.4 Q 793.5 726.0 770.5 726.0
       L 714.5 726.0 Q 691.5 726.0 681.2 705.4 L 592.8 528.7 Q 566.0 475.0 539.2 528.7
       L 450.8 705.4 Q 440.5 726.0 417.5 726.0 Z"
    fill="#ffffff"
  />
  <path
    d="M 508.0 726.0 Q 488.0 726.0 496.9 708.1 L 541.4 619.2 Q 566.0 570.0 590.6 619.2
       L 635.1 708.1 Q 644.0 726.0 624.0 726.0 Z"
    fill="#346ef2"
  />
</svg>
