<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="0.62" y2="1">
      <stop offset="0" stop-color="#3b4256"/>
      <stop offset="0.55" stop-color="#22242a"/>
      <stop offset="1" stop-color="#191a1c"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d3d9e4"/>
    </linearGradient>
    <radialGradient id="spark">
      <stop offset="0" stop-color="#8fb4f7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8fb4f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!--
    Apple's macOS grid, not a full-bleed square: the system applies no mask of its own, so an
    icon drawn edge to edge sits in the Dock as a hard rectangle among rounded neighbours.
    824 of 1024, centred, corner radius 185.
  -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#chassis)"/>

  <ellipse cx="512" cy="792" rx="156" ry="22" fill="#000000" opacity="0.28"/>

  <circle cx="512" cy="214" r="52" fill="url(#spark)"/>
  <path d="M 512 272 L 512 234" stroke="#8fb4f7" stroke-width="15" stroke-linecap="round"/>
  <circle cx="512" cy="214" r="27" fill="#6193f3"/>

  <path d="M 654 616 L 728 560" stroke="url(#shell)" stroke-width="44" stroke-linecap="round"/>
  <path d="M 370 616 L 298 668" stroke="url(#shell)" stroke-width="44" stroke-linecap="round"/>
  <path d="M 736 552 L 812 476" stroke="#aab3c2" stroke-width="26" stroke-linecap="round"/>
  <path d="M 818 470 L 844 444" stroke="#346ef2" stroke-width="35" stroke-linecap="round"/>

  <rect x="316" y="378" width="30" height="76" rx="15" fill="#aab3c2"/>
  <rect x="678" y="378" width="30" height="76" rx="15" fill="#aab3c2"/>

  <rect x="478" y="516" width="68" height="46" fill="#c2c9d6"/>
  <rect x="372" y="556" width="280" height="198" rx="58" fill="url(#shell)"/>
  <rect x="344" y="286" width="336" height="250" rx="78" fill="url(#shell)"/>

  <rect x="378" y="338" width="268" height="122" rx="61" fill="#14161c"/>
