appId: com.scenario.app
# `productName` is deliberately absent: electron-builder would prefer it over the one in
# package.json, which is the copy `shared/constants.test.ts` pins to APP_NAME. Declaring it
# here would leave the shipped name unguarded.
copyright: © 2026 Alban Pasquelin

directories:
  output: release
  buildResources: build

# `beforePack` fetches into `resources/ffmpeg/`, emptying it first — the binaries differ in name
# per platform. Two targets packed at once would take each other's encoder. This is the default,
# declared so a change of default cannot silently break it.
concurrency:
  jobs: 1

# Name, version, platform and architecture, in that order: the two macOS installers differ only
# by the last field, and a release page listing them has to make that legible.
artifactName: ${name}-${version}-${platform}-${arch}.${ext}

# The release is created as a draft by the `release` job, never by the build matrix — see
# docs/ci/adr/ADR-06. Nothing reaches an installed client until the draft is published by hand.
publish:
  provider: github
  owner: pasquelin
  repo: scenario
  releaseType: draft

files:
  - out/**
  - package.json
  # Read at runtime by `nativeImage`: window icon on Windows and Linux, About dialog.
  - build/icon.png
  - '!**/*.map'
  # Redundant today — a whitelist already excludes it — but the exclusion must not depend on
  # every other entry staying positive. An asar opens in a text editor; the API key is in here.
  - '!secrets{,/**/*}'

# `devTools: false` is a per-webContents preference; these are process-level switches that
# would otherwise reopen the same door. `--remote-debugging-port` attaches CDP to the main
# world where `window.studio` lives, and does so under the app's own signing identity —
# which is what safeStorage ties the keychain entry to.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  # The signature must be reset after flipping fuses, or the binary no longer validates.
  resetAdHocDarwinSignature: true

# A native module cannot be loaded from inside the asar archive.
asarUnpack:
  - '**/*.node'

# The encoder the studio ships with. `beforePack` fetches the one matching the target about to
# be packed, so a run building several of them gives each its own. Outside the asar on purpose:
# a binary has to be executable on disk to be spawned.
beforePack: scripts/before-pack.mjs

extraResources:
  - from: resources/ffmpeg
    to: ffmpeg
    filter: ['**/*']
  # Beside the application rather than only inside its Help window: a notice reachable only from
  # a running app is out of reach for whoever cannot start it, and the FFmpeg source offer has to
  # survive that. Both are generated or hand-written at the repository root, never duplicated.
  - from: EULA.md
    to: EULA.md
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md

mac:
  category: public.app-category.graphics-design
  icon: build/icon.svg
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The value Electron 43 already carries in its Info.plist, written down so it stops being
  # implicit: electron-updater reads it to decide whether a client may take an update.
  minimumSystemVersion: '12.0'
  # `notarize` is deliberately left at its default rather than pinned to false: electron-builder
  # only notarises what it managed to sign, so an unsigned build skips it on its own — and the
  # day the secrets of ADR-07 exist, signing and notarising both start without touching this
  # file. No Apple Developer Program is subscribed today; see docs/ci/adr/ADR-04.
  # Signed with the app, or the hardened runtime refuses to spawn it — an unsigned executable
  # inside a signed bundle is exactly what Gatekeeper is there to stop.
  binaries:
    - Contents/Resources/ffmpeg/ffmpeg
    - Contents/Resources/ffmpeg/ffprobe
  target:
    - target: dmg
      arch: [arm64, x64]
    # Not for distribution: electron-updater consumes the zip, and it is cheap to keep.
    - target: zip
      arch: [arm64, x64]

dmg:
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications

win:
  icon: build/icon.svg
  target:
    - target: nsis
      arch: [x64]

nsis:
  # The terms of use of the binary, not the source-available licence of the repository: two
  # different texts, and only this one governs what an installer hands over. Per target — there is
  # no root `license` key, and declaring one fails `validateConfiguration` before any platform is
  # packaged. Not set under `dmg`: a licence there gates mounting the image every single time.
  license: EULA.md
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Per user, so installing needs no administrator: the studio writes to the user's own folders
  # and has nothing to register machine-wide.
  perMachine: false
  createDesktopShortcut: true
  # Projects, settings and the encrypted API key live in appData. Uninstalling a version — to
  # reinstall another — must not take the work with it.
  deleteAppDataOnUninstall: false

linux:
  icon: build/icon.svg
  category: Graphics
  synopsis: Image, video, 3D, audio, texture and skybox creation on the Scenario API
  maintainer: Alban Pasquelin <alban.pasquelin@gmail.com>
  # The one surface of the studio that ships its wording instead of reading it: a `.desktop` file
  # is written at build time and read by the desktop shell, long before any bundle is loaded. It
  # localises the only way it can — one key per locale, `Comment` being the C fallback.
  desktop:
    entry:
      StartupWMClass: Scenario Studio
      Comment: Image, video, 3D, audio, texture and skybox creation on the Scenario API
      Comment[fr]: Création d’images, vidéos, modèles 3D, audio, textures et skyboxes sur l’API Scenario
  target: [AppImage, deb]

appImage:
  license: EULA.md
