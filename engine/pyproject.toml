[project]
name = "ia-studio-engine"
dynamic = ["version"]
description = "The local AI engine of IA Studio: a supervised Python process that measures and executes."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# The core carries no tensor library, and the empty list IS the measurement rather than an
# oversight: `import torch` costs 620 ms warm and 8.7 s cold on the machine this was measured on,
# which is why the core stays at the 10 ms of a bare interpreter. Workers pay it, once, and stay
# alive. The `llm`, `diffusion`, `audio` and `3d` groups land with the worker that needs them.
core = []
# The door that holds tensors. NEVER installed by `pnpm engine:check`: the gate would then
# download 682 Mo to be green, and the tests of `engine/tests` are written to need none of it.
diffusion = [
  "torch>=2.6",          # 2.6 is where `torch.load` stopped unpickling by default — spec § I.2
  "diffusers>=0.40",
  "transformers>=5.0",
  "accelerate>=1.0",
  "safetensors>=0.4",
  # `[?]` A video model would ALSO need `imageio` and `imageio-ffmpeg`, which `export_to_video`
  # writes through. Not declared while none is admitted: adding one re-locks, and asks for the
  # 682 Mo environment to be materialised for its licence notice alone.
]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One truth for the version: `__init__.py` holds it, the manifest reads it.
[tool.hatch.version]
path = "src/ia_studio_engine/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ia_studio_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
