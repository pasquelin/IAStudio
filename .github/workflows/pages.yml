name: Pages

# The presentation site, served from `docs/` — a static page with no build step. What this
# workflow adds is the ONE thing the page cannot know on its own: which version is out, and
# where its five installers live. It writes `docs/assets/release.json`, which `main.js` reads
# to fill the version chip and the download cards.
#
# Nothing is committed back to the repository: the file is generated into the artefact that
# gets deployed, so no tag ever produces a commit, and `docs/` stays free of a generated file
# that would conflict on every merge.
#
# It runs on a published release rather than on the tag: `release.yml` builds the three
# platforms and leaves a DRAFT, deliberately (ADR-06). Deploying on the tag would advertise
# installers that nobody has looked at yet.
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:

# One deployment at a time, and the newest wins — but never cancelled mid-upload, which
# would leave the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # The latest PUBLISHED release, drafts and pre-releases excluded — `/releases/latest`
      # already filters both. A repository with no release yet answers 404, and that is the
      # normal case before the first version: the step leaves no file behind and the page
      # keeps the wording it ships with.
      - name: Write the release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > release.json 2>/dev/null; then
            echo "No published release yet — the page keeps its built-in wording." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Each card is matched on the artefact name that electron-builder produces,
          # `${name}-${version}-${platform}-${arch}.${ext}` — see electron-builder.yml.
          # A platform missing from the release is left to say so rather than 404.
          jq '{
            tag: .tag_name,
            published: .published_at,
            assets: (
              .assets
              | map({
                  key: (
                    if   .name | test("darwin.*arm64.*\\.dmg$")  then "darwin-arm64"
                    elif .name | test("darwin.*x64.*\\.dmg$")    then "darwin-x64"
                    elif .name | test("win32.*\\.exe$")          then "win32-x64"
                    elif .name | test("\\.AppImage$")            then "linux-AppImage"
                    elif .name | test("\\.deb$")                 then "linux-deb"
                    else empty end
                  ),
                  value: {
                    url: .browser_download_url,
                    size: ((.size / 1048576) | floor | tostring + " Mo")
                  }
                })
              | from_entries
            )
          }' release.json > docs/assets/release.json

          rm release.json
          echo "Published version: $(jq -r .tag docs/assets/release.json)" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.assets | keys[] | "- " + .' docs/assets/release.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
