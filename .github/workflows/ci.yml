name: CI

# Linux only, and no Electron packaging: what breaks a pull request is a type, a rule or a test,
# and those answer in minutes. The three-OS matrix belongs to release.yml — see
# docs/ci/adr/ADR-09-budget-minutes-ci.md.
on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test

      # `electron-vite build` rather than `pnpm build`, which would run the typecheck a second
      # time. The step above already did it, and did it first so a type error answers early.
      - run: pnpm exec electron-vite build

      # What `pnpm build` adds beyond the bundler, spelled out because this job cannot call it:
      # nothing else in the pipeline looks at the artefact, and a duplicate is made by the
      # bundler out of files no import graph reaches.
      - run: node scripts/check-artefact.mjs
